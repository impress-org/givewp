name: WordPress Tests

# Controls when the action will run.
on:
    # Triggers the workflow on push or pull request events but only for the master branch
    push:
        branches: [ master, develop, epic/**, release/** ]
    pull_request:

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

    # Allows you to use this workflow as part of another workflow
    workflow_call:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    # This workflow contains a single job called "test"
    test:
        # The type of runner that the job will run on
        runs-on: blacksmith-4vcpu-ubuntu-2404

        # The job reads the checkout and runs the test suite, nothing else.
        permissions:
            contents: read

        strategy:
            # One failing combination says nothing about the others, so let them all finish.
            fail-fast: false
            matrix:
                php: [7.4, 8.4]
                mysql: [ 'mysql:5.7', 'mysql:8.0' ]
                # `minimum` is the "Requires at least" line of readme.txt, so the oldest version
                # tested is always the oldest one the plugin says it supports.
                wordpress: [ minimum, latest ]

        services:
            # This was a total pain to get setup. The default authentication plugin changed in MySQL 8 and is incompatible
            # with WordPress. So it needs to be set back to mysql_native_password. The best way to do this is to use the
            # command option in docker to apply it once the container is set up... but Github Actions does not support this.
            # The workaround is to execute the command in the options, but it is VITAL that it is the LAST option and that any
            # environment variables are added via options. DO NOT ADD THE ENV LINE IN YAML. You've been warned.
            # MySQL 5.7 accepts the same flag, so one service covers every matrix entry and each job starts only the
            # database it tests against.
            # --log-error-verbosity=1 keeps the server log to errors only; at the default level MySQL
            # writes a note for every TRUNCATE, and the test suite runs thousands of them.
            # @see https://github.com/docker-library/mysql/issues/690
            mysql:
                image: ${{ matrix.mysql }}
                ports:
                    - 3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3 -e MYSQL_ROOT_PASSWORD=N0Tweak!@123! --entrypoint sh ${{ matrix.mysql }} -c "exec docker-entrypoint.sh mysqld --default-authentication-plugin=mysql_native_password --log-error-verbosity=1"

        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            -   uses: actions/checkout@v7
                with:
                    # Nothing here pushes over git, and the job goes on to run third-party actions.
                    persist-credentials: false
            # @link https://github.com/spatie/laravel-activitylog/blob/master/.github/workflows/run-tests.yml
            -   name: Set Up PHP for build
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 7.4
                    extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
                    coverage: none

            # Caches Composer's downloads, keyed on composer.lock and the PHP version.
            -   name: Install composer dependencies
                uses: ramsey/composer-install@v4

            -   name: Store MySQL details in environment
                run: |
                    echo "mysql_port=${{ job.services.mysql.ports['3306'] }}" >> "$GITHUB_ENV"
                    echo "mysql_pass=N0Tweak!@123!" >> "$GITHUB_ENV"

            -   name: Configure MySQL
                run: mysql -uroot --password='${{ env.mysql_pass}}' -h127.0.0.1 --port=${{env.mysql_port}}

            -   name: Set Up PHP for testing
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
                    coverage: none

            -   name: Reload Composer autoload
                run: composer dump-autoload

            -   name: Install SVN
                run: |
                  sudo apt-get update
                  sudo apt-get install -y subversion
                  svn --version

            -   name: Resolve the WordPress version
                run: |
                    version=latest
                    if [ "$WORDPRESS" = minimum ]; then
                        version=$(sed -n 's/^Requires at least: *//p' readme.txt)
                        [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::No usable \"Requires at least\" in readme.txt: '$version'"; exit 1; }
                    fi
                    echo "wordpress_version=$version" >> "$GITHUB_ENV"
                env:
                    WORDPRESS: ${{ matrix.wordpress }}

            -   name: Set Up Tests
                run: bash tests/includes/bin/install.sh wordpress_test root ${{ env.mysql_pass }} 127.0.0.1:${{ env.mysql_port }} ${{ env.wordpress_version }}

            -   name: Run Tests
                run: composer test
                env:
                    DB_PORT: ${{ env.mysql_port }}

    # The same suite inside wp-env, the way `npm run test:php` runs it locally. wp-env's database
    # is MariaDB and cannot be changed, which makes this the MariaDB half of the matrix: the job
    # above covers MySQL.
    test-mariadb:
        runs-on: blacksmith-4vcpu-ubuntu-2404

        # A run takes a few minutes. The cap is for a database that stops answering, which would
        # otherwise hold the job, and a release waiting on it, for six hours.
        timeout-minutes: 20

        # The job reads the checkout and runs the test suite, nothing else.
        permissions:
            contents: read

        strategy:
            # One failing combination says nothing about the others, so let them all finish.
            fail-fast: false
            matrix:
                php: [7.4, 8.4]
                # `minimum` is the "Requires at least" line of readme.txt, so the oldest version
                # tested is always the oldest one the plugin says it supports.
                wordpress: [ minimum, latest ]

        env:
            WP_ENV_PHP_VERSION: ${{ matrix.php }}

        steps:
            -   uses: actions/checkout@v7
                with:
                    # Nothing here pushes over git, and the job goes on to run third-party actions.
                    persist-credentials: false

            # Composer runs on the runner, on the PHP version the release is built with. The tests
            # run on the container's PHP.
            -   name: Set Up PHP for build
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 7.4
                    coverage: none

            # Caches Composer's downloads, keyed on composer.lock and the PHP version.
            -   name: Install composer dependencies
                uses: ramsey/composer-install@v4

            -   name: Set Up Node
                uses: actions/setup-node@v7
                with:
                    node-version-file: .nvmrc

            # wp-env is the only Node package this job uses, so it is installed alone, at the
            # version package.json pins, rather than with everything else in the lockfile.
            -   name: Install wp-env
                run: npm install --global "@wordpress/env@$(node -p "require('./package.json').devDependencies['@wordpress/env']")"

            # wp-env takes the WordPress to install from WP_ENV_CORE.
            -   name: Resolve the WordPress version
                run: |
                    core=https://wordpress.org/latest.zip
                    if [ "$WORDPRESS" = minimum ]; then
                        version=$(sed -n 's/^Requires at least: *//p' readme.txt)
                        [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::No usable \"Requires at least\" in readme.txt: '$version'"; exit 1; }
                        core=https://wordpress.org/wordpress-$version.zip
                    fi
                    echo "WP_ENV_CORE=$core" >> "$GITHUB_ENV"
                env:
                    WORDPRESS: ${{ matrix.wordpress }}

            -   name: Start wp-env
                run: npm run env:test:start

            -   name: Run Tests
                run: npm run test:php
