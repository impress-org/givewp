name: E2E Tests

# Playwright browser tests against a wp-env WordPress install. This covers what PHPUnit cannot
# see: asset enqueuing, the React admin apps mounting, and the v3 REST requests they make.

on:
    push:
        branches: [master, develop, epic/**, release/**]
    pull_request:
        branches: [master, develop, epic/**, release/**]
    workflow_dispatch:
    workflow_call:

jobs:
    e2e:
        runs-on: blacksmith-4vcpu-ubuntu-2404

        # The job reads the checkout and runs the browser tests, nothing else.
        permissions:
            contents: read

        env:
            # Add-ons whose latest GitHub release is installed next to core before the suite runs.
            # Comma-separated repository names under impress-org; each release carries <slug>.zip.
            ADDONS: give-peer-to-peer,give-recurring,give-funds

        steps:
            -   uses: actions/checkout@v7
                with:
                    # Nothing here pushes over git, and the job goes on to run third-party actions.
                    persist-credentials: false

            # wp-env pulls these images when it starts, and pulling them is part of the time that
            # step takes. .wp-env.json sets no PHP version, so wp-env uses the default tags. Started
            # now, in the background, the download overlaps with the steps in between.
            # The images are the ones wp-env's generated Dockerfiles and docker-compose.yml name
            # (FROM wordpress..., FROM wordpress:cli..., image: mariadb:lts); if a later wp-env names
            # others, these pulls are just wasted, never wrong. A failed pull only means wp-env pulls
            # the image itself, as it always did, so this step cannot fail the job.
            -   name: Start pulling the wp-env Docker images
                continue-on-error: true
                env:
                    IMAGES: wordpress wordpress:cli mariadb:lts
                run: |
                    (
                        set +e
                        start=$(date +%s)
                        for image in $IMAGES; do
                            docker pull --quiet "$image" || echo "Could not pull $image, wp-env will pull it." &
                        done
                        wait
                        echo "Pulled in $(( $(date +%s) - start )) seconds."
                        touch "$RUNNER_TEMP/docker-pull.done"
                    ) > "$RUNNER_TEMP/docker-pull.log" 2>&1 < /dev/null &

            # The plugin will not boot without the Strauss-prefixed vendor directory, which is
            # produced by Composer's post-install-cmd. PHP 7.4 matches the version the release
            # zip is built on.
            -   name: Set Up PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 7.4
                    coverage: none

            -   name: Install Composer dependencies
                uses: ramsey/composer-install@v4
                with:
                    composer-options: --no-dev

            -   name: Set Up Node
                uses: actions/setup-node@v7
                with:
                    node-version-file: .nvmrc
                    cache: npm

            # The same flags as the release build in .puprc. --prefer-offline takes packages from the
            # npm cache that setup-node restored without asking the registry about each one first;
            # --no-audit and --no-fund skip two network calls that change nothing here.
            -   name: Install Node dependencies
                run: npm ci --prefer-offline --no-audit --no-fund

            # webpack's filesystem cache (see webpack.config.js). It sits in .cache/webpack, outside
            # node_modules, so npm ci cannot delete it. The lockfile is in the key, but webpack
            # invalidates individual entries by content hash itself; a cache from an older commit is
            # just a warmer start.
            -   name: Cache webpack build cache
                uses: actions/cache@v6
                with:
                    path: .cache/webpack
                    key: webpack-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
                    restore-keys: |
                        webpack-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

            # The admin screens under test are React apps served from build/, which is gitignored.
            -   name: Build assets
                run: npm run build

            # The add-on repositories are private and GITHUB_TOKEN only reads this one, so an
            # installation token from the GitHub App named in the secrets reads their releases.
            # The token is cut down to the add-on repositories and to reading their contents,
            # whatever the App's installation covers, so a workflow edit on a branch cannot borrow
            # it for anything else. Only pull requests from forks skip this, because they have no
            # secrets; anywhere else a missing secret fails the run rather than quietly testing
            # core alone.
            -   name: Create a token that can read the add-on releases
                id: addons-token
                if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
                uses: actions/create-github-app-token@v2
                with:
                    app-id: ${{ secrets.ADDONS_APP_ID }}
                    private-key: ${{ secrets.ADDONS_APP_PRIVATE_KEY }}
                    owner: impress-org
                    repositories: ${{ env.ADDONS }}
                    permission-contents: read

            # The release zip is what customers install: vendor/ and compiled assets included,
            # wrapped in a <slug>/ directory, so it unzips straight into a plugins directory.
            # .wp-env.override.json outranks .wp-env.json, and wp-env activates every plugin it
            # names. WP_DEBUG_DISPLAY goes off because an add-on's PHP deprecation notice printed
            # into a REST response breaks its JSON and with it every spec, which is not the
            # compatibility signal this run is after. E2E_ADDONS tells the specs which add-ons to
            # expect active.
            -   name: Install the latest add-on releases
                if: steps.addons-token.outputs.token != ''
                env:
                    GH_TOKEN: ${{ steps.addons-token.outputs.token }}
                run: |
                    mkdir -p addons
                    plugins='"."'
                    for slug in ${ADDONS//,/ }; do
                        gh release download --repo "impress-org/$slug" --pattern "$slug.zip" --dir addons
                        unzip -q "addons/$slug.zip" -d addons
                        plugins="$plugins, \"./addons/$slug\""
                    done
                    echo "{\"plugins\": [$plugins], \"config\": {\"WP_DEBUG_DISPLAY\": false}}" > .wp-env.override.json
                    echo "E2E_ADDONS=${ADDONS//,/ }" >> "$GITHUB_ENV"

            # Waits for the pulls started earlier, so wp-env does not start a second download of an
            # image that is still coming, and prints how long they took. Gives up after two minutes
            # and lets wp-env carry on; never fails the job.
            -   name: Wait for the Docker image pulls
                continue-on-error: true
                timeout-minutes: 3
                run: |
                    for _ in $(seq 120); do
                        [ -f "$RUNNER_TEMP/docker-pull.done" ] && break
                        sleep 1
                    done
                    cat "$RUNNER_TEMP/docker-pull.log" 2>/dev/null || true

            -   name: Start WordPress environment
                run: npx wp-env start

            # Not cached on purpose: restoring the binary plus installing its OS libraries takes
            # longer than the plain install.
            -   name: Install Playwright browsers
                run: npx playwright install chromium --with-deps

            -   name: Run E2E tests
                run: npm run test:e2e

            -   name: Upload artifacts on failure
                uses: actions/upload-artifact@v7
                if: failure()
                with:
                    name: e2e-artifacts
                    # Not all of artifacts/ - that directory also holds the storage state, which
                    # carries the logged-in admin cookie for the wp-env site.
                    path: artifacts/test-results/
                    retention-days: 7
