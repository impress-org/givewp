name: E2E Tests

# Playwright browser tests against a wp-env WordPress install. This covers what PHPUnit cannot
# see: asset enqueuing, the React admin apps mounting, and the v3 REST requests they make.

on:
    push:
        branches: [master, develop, epic/**, release/**]
    pull_request:
        branches: [master, develop, epic/**, release/**]
    workflow_dispatch:
    workflow_call:

jobs:
    e2e:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7
                with:
                    # Nothing here pushes over git, and the job goes on to run third-party actions.
                    persist-credentials: false

            # The plugin will not boot without the Strauss-prefixed vendor directory, which is
            # produced by Composer's post-install-cmd. PHP 7.4 matches the version the release
            # zip is built on.
            -   name: Set Up PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 7.4
                    coverage: none

            -   name: Install Composer dependencies
                run: composer install --no-dev --no-progress --no-interaction

            -   name: Set Up Node
                uses: actions/setup-node@v7
                with:
                    node-version-file: .nvmrc
                    cache: npm

            -   name: Install Node dependencies
                run: npm ci

            # The admin screens under test are React apps served from build/, which is gitignored.
            -   name: Build assets
                run: npm run build

            -   name: Start WordPress environment
                run: npx wp-env start

            -   name: Install Playwright browsers
                run: npx playwright install chromium --with-deps

            -   name: Run E2E tests
                run: npm run test:e2e

            -   name: Upload artifacts on failure
                uses: actions/upload-artifact@v7
                if: failure()
                with:
                    name: e2e-artifacts
                    path: artifacts/
                    retention-days: 7

            -   name: Stop WordPress environment
                if: always()
                run: npx wp-env stop
