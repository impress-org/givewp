name: E2E Tests

# Playwright browser tests against a wp-env WordPress install. This covers what PHPUnit cannot
# see: asset enqueuing, the React admin apps mounting, and the v3 REST requests they make.

on:
    push:
        branches: [master, develop, epic/**, release/**]
    pull_request:
        branches: [master, develop, epic/**, release/**]
    workflow_dispatch:
    workflow_call:

jobs:
    e2e:
        runs-on: blacksmith-4vcpu-ubuntu-2404

        # The job reads the checkout and runs the browser tests, nothing else.
        permissions:
            contents: read

        env:
            # Add-ons whose latest GitHub release is installed next to core before the suite runs.
            # Comma-separated repository names under impress-org; each release carries <slug>.zip.
            ADDONS: give-peer-to-peer
            # Read here so the steps below can skip when the secret is absent, which is every pull
            # request from a fork.
            ADDONS_APP_ID: ${{ secrets.ADDONS_APP_ID }}

        steps:
            -   uses: actions/checkout@v7
                with:
                    # Nothing here pushes over git, and the job goes on to run third-party actions.
                    persist-credentials: false

            # The plugin will not boot without the Strauss-prefixed vendor directory, which is
            # produced by Composer's post-install-cmd. PHP 7.4 matches the version the release
            # zip is built on.
            -   name: Set Up PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 7.4
                    coverage: none

            -   name: Install Composer dependencies
                run: composer install --no-dev --no-progress --no-interaction

            -   name: Set Up Node
                uses: actions/setup-node@v7
                with:
                    node-version-file: .nvmrc
                    cache: npm

            -   name: Install Node dependencies
                run: npm ci

            # webpack's filesystem cache (see webpack.config.js). The lockfile is the key because
            # webpack invalidates individual entries by content hash itself; a cache from an older
            # commit is just a warmer start.
            -   name: Cache webpack build cache
                uses: actions/cache@v6
                with:
                    path: node_modules/.cache/webpack
                    key: webpack-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
                    restore-keys: |
                        webpack-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

            # The admin screens under test are React apps served from build/, which is gitignored.
            -   name: Build assets
                run: npm run build

            # The add-on repositories are private and GITHUB_TOKEN only reads this one, so an
            # installation token from the GitHub App named in the secrets reads their releases.
            # The token is cut down to the add-on repositories whatever the App's installation
            # covers, so a workflow edit on a branch cannot borrow it for anything else.
            -   name: Create a token that can read the add-on releases
                id: addons-token
                if: env.ADDONS_APP_ID != ''
                uses: actions/create-github-app-token@v2
                with:
                    app-id: ${{ secrets.ADDONS_APP_ID }}
                    private-key: ${{ secrets.ADDONS_APP_PRIVATE_KEY }}
                    owner: impress-org
                    repositories: ${{ env.ADDONS }}

            # The release zip is what customers install: vendor/ and compiled assets included,
            # wrapped in a <slug>/ directory, so it unzips straight into a plugins directory.
            # .wp-env.override.json outranks .wp-env.json, and wp-env activates every plugin it
            # names. WP_DEBUG_DISPLAY goes off because an add-on's PHP deprecation notice printed
            # into a REST response breaks its JSON and with it every spec, which is not the
            # compatibility signal this run is after. E2E_ADDONS tells the specs which add-ons to
            # expect active.
            -   name: Install the latest add-on releases
                if: steps.addons-token.outputs.token != ''
                env:
                    GH_TOKEN: ${{ steps.addons-token.outputs.token }}
                run: |
                    mkdir -p addons
                    plugins='"."'
                    for slug in ${ADDONS//,/ }; do
                        gh release download --repo "impress-org/$slug" --pattern "$slug.zip" --dir addons
                        unzip -q "addons/$slug.zip" -d addons
                        plugins="$plugins, \"./addons/$slug\""
                    done
                    echo "{\"plugins\": [$plugins], \"config\": {\"WP_DEBUG_DISPLAY\": false}}" > .wp-env.override.json
                    echo "E2E_ADDONS=${ADDONS//,/ }" >> "$GITHUB_ENV"

            -   name: Start WordPress environment
                run: npx wp-env start

            # Not cached on purpose: restoring the binary plus installing its OS libraries takes
            # longer than the plain install.
            -   name: Install Playwright browsers
                run: npx playwright install chromium --with-deps

            -   name: Run E2E tests
                run: npm run test:e2e

            -   name: Upload artifacts on failure
                uses: actions/upload-artifact@v7
                if: failure()
                with:
                    name: e2e-artifacts
                    # Not all of artifacts/ - that directory also holds the storage state, which
                    # carries the logged-in admin cookie for the wp-env site.
                    path: artifacts/test-results/
                    retention-days: 7
