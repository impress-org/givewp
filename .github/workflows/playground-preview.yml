name: Playground Preview

# Adds a "Try in WordPress Playground" comment to every pull request: a throwaway WordPress in the
# browser with the pull request's build installed. The work is in the shared workflow in
# stellarwp/plugin-toolbox, which builds the zip with pup through the shared zip workflow and puts
# it in the public bucket the packaging bot uses. What is GiveWP's own is in the two blueprint files
# in .github/playground/, one link each.
#
# Pull requests from forks are skipped, because they cannot see the bucket credentials.
#
# Run it locally: see docs/testing.md#playground-previews.

on:
    pull_request:
        types: [opened, reopened, synchronize]

# One run per pull request at a time. A push while a preview is still building cancels that build,
# so an older zip can never overwrite a newer comment.
concurrency:
    group: playground-preview-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    playground-preview:
        permissions:
            contents: read
            pull-requests: write
        uses: stellarwp/plugin-toolbox/.github/workflows/playground-preview.yml@main
        with:
            # GiveWP supports PHP 7.4 and up, so the vendor directory has to be built on 7.4.
            php-version: '7.4'
            blueprints: |
                .github/playground/blueprint.json
                .github/playground/blueprint-sample-data.json
            runs-on: blacksmith-4vcpu-ubuntu-2404
        # Passed one by one: `secrets: inherit` only works inside one organization.
        secrets:
            s3-bucket: ${{ secrets.ZIP_S3_BUCKET }}
            s3-access-key-id: ${{ secrets.ZIP_S3_ACCESS_KEY_ID }}
            s3-secret-access-key: ${{ secrets.ZIP_S3_SECRET_ACCESS_KEY }}
            s3-region: ${{ secrets.ZIP_S3_REGION }}
            s3-endpoint: ${{ secrets.ZIP_S3_ENDPOINT }}
            jenkins-secret: ${{ secrets.SLACK_PACKAGING_SECRET }}
