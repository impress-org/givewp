name: Plugin Check

# Runs WordPress.org's Plugin Check against the built plugin: the same files the release zip ships,
# so tests, dotfiles, node_modules and other dev-only files cannot cause false positives.
#
# GiveWP still has known Plugin Check problems, fixed one ticket at a time. Until they are all gone
# the job does not fail on every error. The "check" job runs wordpress/plugin-check-action. The
# "report" job counts errors and warnings per rule and compares them with
# .github/plugin-check/baseline.json: a rule with more errors than the baseline fails the check.
# More warnings, or fewer of either, only add a notice. See docs/testing.md#plugin-check.
#
# Four jobs, so the third-party action never holds a token that can write:
#   start   posts "in progress" on the pull request.
#   build   builds the zip once (build-zip.yml) and uploads it as the give-plugin-zip artifact.
#   check   downloads the zip and runs the action. Read-only token, no checkout.
#   report  compares the results with the baseline and replaces the comment with the result.
#
# The action also tries to post its own comment. With a read-only token that call fails (it logs
# "Failed to post PR comment" and carries on), so the only comment is ours. Once every error count
# is zero, drop "start" and "report", remove continue-on-error from "check", and let the action
# fail on any error and post its own comment.

on:
    pull_request:
    push:
        branches: [ develop, master ]
    workflow_dispatch:

# A new push to a pull request cancels the run still going for the older commit.
concurrency:
    group: plugin-check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    # Hidden line that marks the sticky pull request comment. Keep it in sync with ratchet.sh.
    COMMENT_MARKER: '<!-- givewp-plugin-check -->'
    # Only pull requests from this repository get a comment: a fork's token is read-only.
    COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
    start:
        name: Plugin Check start
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
            pull-requests: write
        steps:
            # The sticky comment follows the pattern of Kadence's stellar-zip.yml: one comment per
            # pull request, found by a hidden marker line and replaced on every run. The badge time
            # is Eastern Time: %Z prints EST in winter and EDT in summer.
            -   name: Make the start badge
                id: badge
                run: |
                    stamp=$(LC_ALL=C TZ='America/New_York' date '+%m/%d %I:%M %p %Z')
                    stamp=${stamp// /%20}
                    stamp=${stamp//\//%2F}
                    echo "url=https://img.shields.io/badge/Check%20Started-${stamp}-blue" >> "$GITHUB_OUTPUT"

            -   name: Find the Plugin Check comment
                id: find_comment
                continue-on-error: true
                uses: peter-evans/find-comment@v4
                with:
                    issue-number: ${{ github.event.pull_request.number }}
                    comment-author: 'github-actions[bot]'
                    body-includes: ${{ env.COMMENT_MARKER }}

            -   name: Post "in progress"
                continue-on-error: true
                uses: peter-evans/create-or-update-comment@v5
                with:
                    comment-id: ${{ steps.find_comment.outputs.comment-id }}
                    issue-number: ${{ github.event.pull_request.number }}
                    edit-mode: replace
                    body: |
                        ${{ env.COMMENT_MARKER }}
                        ⏳ Plugin Check in progress

                        ![Plugin Check started](${{ steps.badge.outputs.url }})

    # Builds the zip in its own job, so the job that runs the third-party action has no checkout and
    # no build tools, and "Re-run failed jobs" can run the check again without building again.
    build:
        name: Plugin Check build
        uses: ./.github/workflows/build-zip.yml
        permissions:
            contents: read

    check:
        name: Plugin Check run
        needs: build
        runs-on: blacksmith-4vcpu-ubuntu-2404

        # Starting WordPress and running the check take about 3 minutes. The cap is for a container
        # that stops answering.
        timeout-minutes: 20

        # Read-only on purpose: this job runs a third-party action. Its own attempt to post a
        # comment fails with this token, which is what keeps the pull request to one comment.
        permissions:
            contents: read

        steps:
            # No checkout: the job only needs the built plugin. With an empty workspace there is no
            # .wp-env.json for the action to merge into (the repo's own file mounts the repo root
            # as a plugin).
            -   name: Download the plugin zip
                uses: actions/download-artifact@v8
                with:
                    name: ${{ needs.build.outputs.artifact-name }}
                    path: ${{ runner.temp }}/plugin-zip

            # The zip's top folder is named after zip_name in .puprc: give.
            -   name: Unzip the plugin
                run: |
                    mkdir -p "$GITHUB_WORKSPACE/build"
                    unzip -q "$RUNNER_TEMP/plugin-zip/give.zip" -d "$GITHUB_WORKSPACE/build"
                    test -f "$GITHUB_WORKSPACE/build/give/give.php"

            # Fails on any error, which is expected for now: the report job decides pass or fail
            # from the counts. The action writes its results to $RUNNER_TEMP/plugin-check-results.txt
            # and uploads them as the plugin-check-results artifact.
            -   name: Run Plugin Check
                continue-on-error: true
                uses: wordpress/plugin-check-action@v1
                with:
                    build-dir: ${{ github.workspace }}/build/give
                    # No categories input: every category runs (general, plugin_repo, security,
                    # performance, accessibility). The five runtime checks are excluded: they
                    # boot WordPress with a scratch table prefix (wp_pc_), GiveWP's custom tables
                    # do not exist under it, and the whole run dies with "Error: Database Query"
                    # (SOFT-4567). Activating GiveWP first does not help. Remove this once that
                    # is solved.
                    exclude-checks: |
                        enqueued_scripts_scope
                        enqueued_scripts_size
                        enqueued_styles_scope
                        enqueued_styles_size
                        non_blocking_scripts

    report:
        name: Plugin Check
        needs: [ start, check ]
        # "start" is skipped for forks and non-pull-request runs, which would skip this job too.
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 10

        # Writes one sticky comment on the pull request.
        permissions:
            contents: read
            issues: write
            pull-requests: write

        steps:
            # Only the ratchet script and the baseline are needed.
            -   uses: actions/checkout@v7
                with:
                    sparse-checkout: .github/plugin-check
                    persist-credentials: false

            -   name: Set file paths
                run: |
                    {
                        echo "RESULTS=$RUNNER_TEMP/results/plugin-check-results.txt"
                        echo "COMMENT_BODY=$RUNNER_TEMP/plugin-check-comment.md"
                        echo "NEW_BASELINE=$RUNNER_TEMP/report/baseline.json"
                    } >> "$GITHUB_ENV"

            # The action uploaded its results under this name. Missing when the build or the check
            # broke before then: the compare step below reports that.
            -   name: Download the results
                continue-on-error: true
                uses: actions/download-artifact@v8
                with:
                    name: plugin-check-results
                    path: ${{ runner.temp }}/results

            # A baseline made from this run, uploaded even when the compare below fails. To lower
            # the committed baseline after a fix, copy this file over .github/plugin-check/.
            -   name: Write a new baseline
                run: |
                    mkdir -p "$RUNNER_TEMP/report"
                    if [ -f "$RESULTS" ]; then
                        cp "$RESULTS" "$RUNNER_TEMP/report/"
                        PLUGIN_CHECK_BASELINE="$NEW_BASELINE" .github/plugin-check/ratchet.sh --update "$RESULTS"
                    fi

            -   name: Upload the report
                id: artifact
                uses: actions/upload-artifact@v7
                with:
                    name: plugin-check-report
                    path: ${{ runner.temp }}/report
                    if-no-files-found: ignore

            -   name: Make the finish badge
                id: finish_badge
                run: |
                    stamp=$(LC_ALL=C TZ='America/New_York' date '+%m/%d %I:%M %p %Z')
                    stamp=${stamp// /%20}
                    stamp=${stamp//\//%2F}
                    echo "url=https://img.shields.io/badge/Check%20Finished-${stamp}-darkgreen" >> "$GITHUB_OUTPUT"

            # Fails the job when a rule has more errors than the baseline. Also writes the short
            # comment body and the same text to the job summary.
            -   name: Compare with the baseline
                env:
                    COMMENT_BADGE: ${{ steps.finish_badge.outputs.url }}
                    ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
                    RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                run: .github/plugin-check/ratchet.sh --comment-file "$COMMENT_BODY" "$RESULTS"

            # When the build or the check broke, the script never wrote a body. Say so instead of
            # leaving "in progress" behind.
            -   name: Prepare the comment
                if: ${{ !cancelled() && env.COMMENT == 'true' }}
                env:
                    BADGE: ${{ steps.finish_badge.outputs.url }}
                    RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                run: |
                    if [ ! -s "$COMMENT_BODY" ]; then
                        printf '%s\n❌ Plugin Check could not run\n\n![Plugin Check finished](%s)\n\n📎 [Run](%s)\n' "$COMMENT_MARKER" "$BADGE" "$RUN_URL" > "$COMMENT_BODY"
                    fi

            -   name: Find the Plugin Check comment
                id: find_comment
                if: ${{ !cancelled() && env.COMMENT == 'true' }}
                continue-on-error: true
                uses: peter-evans/find-comment@v4
                with:
                    issue-number: ${{ github.event.pull_request.number }}
                    comment-author: 'github-actions[bot]'
                    body-includes: ${{ env.COMMENT_MARKER }}

            -   name: Post the result
                if: ${{ !cancelled() && env.COMMENT == 'true' }}
                continue-on-error: true
                uses: peter-evans/create-or-update-comment@v5
                with:
                    comment-id: ${{ steps.find_comment.outputs.comment-id }}
                    issue-number: ${{ github.event.pull_request.number }}
                    edit-mode: replace
                    body-path: ${{ env.COMMENT_BODY }}
