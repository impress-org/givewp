name: Plugin Check

# Runs WordPress.org's Plugin Check on the built plugin and compares the error counts with the
# baseline committed in .plugin-check-baseline.json. GiveWP still has known Plugin Check problems,
# fixed one ticket at a time; until they are all gone, only a rule with more errors than the baseline
# fails. See docs/testing.md#plugin-check.
#
# The work is in stellarwp/plugin-toolbox/.github/workflows/plugin-check.yml.
#
# Run it locally: see README.md, "Plugin Check".

on:
    pull_request:
    push:
        branches: [ develop, master ]
    # A manual run: the branch to check, and the branch whose baseline it is compared with. There is
    # no pull request to comment on, so the result is in the run's summary.
    workflow_dispatch:
        inputs:
            head-ref:
                description: Branch to check
                required: true
            base-ref:
                description: Branch to compare with
                required: true
                default: develop

# A new push to a pull request cancels the run still going for the older commit. Manual runs of
# different branches have their own groups, so they do not cancel each other.
concurrency:
    group: plugin-check-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && format('{0}:{1}:{2}', github.ref, inputs.head-ref, inputs.base-ref)) || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    plugin-check:
        permissions:
            contents: read
            issues: write
            pull-requests: write
        # Pinned to a commit, like the other plugin-toolbox calls. Switch to @v1 once plugin-toolbox
        # publishes a release. To take a toolbox change, bump the commit here.
        # TODO: this commit is on the unmerged plugin-toolbox branch plugin-check-manual-refs. Bump it to
        # the commit of the merged change before this pull request is merged.
        uses: stellarwp/plugin-toolbox/.github/workflows/plugin-check.yml@95afba6dfd16d70cbe0255939569858432867861
        with:
            plugin-slug: give
            # The pup release the release build uses (composer.json), so the check builds the same way.
            pup-version: '2.0.0'
            runs-on: blacksmith-4vcpu-ubuntu-2404
            # webpack's filesystem cache (see webpack.config.js). Outside node_modules, because pup
            # build runs npm ci and npm ci deletes node_modules first.
            cache-paths: .cache/webpack
            # Empty for a pull request or a push, so those behave as before.
            head-ref: ${{ inputs.head-ref }}
            base-ref: ${{ inputs.base-ref }}
