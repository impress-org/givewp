name: Plugin Check

# Runs WordPress.org's Plugin Check on the built plugin and compares the error counts with the
# baseline committed in .plugin-check-baseline.json. GiveWP still has known Plugin Check problems,
# fixed one ticket at a time; until they are all gone, only a rule with more errors than the baseline
# fails. See docs/testing.md#plugin-check.
#
# The work is in stellarwp/plugin-toolbox/.github/workflows/plugin-check.yml.
#
# Run it locally: see README.md, "Plugin Check".

on:
    pull_request:
    push:
        branches: [ develop, master ]
    workflow_dispatch:

# A new push to a pull request cancels the run still going for the older commit.
concurrency:
    group: plugin-check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    plugin-check:
        permissions:
            contents: read
            issues: write
            pull-requests: write
        # Pinned to a commit, like the other plugin-toolbox calls. Switch to @v1 once plugin-toolbox
        # publishes a release. To take a toolbox change, bump the commit here.
        uses: stellarwp/plugin-toolbox/.github/workflows/plugin-check.yml@2a409f7161ce1518dca9b82c5ef302b81293f835
        with:
            plugin-slug: give
            # The pup release the release build uses (composer.json), so the check builds the same way.
            pup-version: '2.0.0'
            runs-on: blacksmith-4vcpu-ubuntu-2404
            # webpack's filesystem cache (see webpack.config.js). Outside node_modules, because pup
            # build runs npm ci and npm ci deletes node_modules first.
            cache-paths: .cache/webpack
