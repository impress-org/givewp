name: Plugin Check

# Runs WordPress.org's Plugin Check on the built plugin and compares the error counts with an
# earlier run. GiveWP still has known Plugin Check problems, fixed one ticket at a time; until they
# are all gone, only a rule with more errors than the baseline fails. See docs/testing.md#plugin-check.
#
# The work is in stellarwp/plugin-toolbox/.github/workflows/plugin-check.yml. Keep this file's
# name: the baselines are the artifacts of its earlier runs.
#
# Run it locally: see README.md, "Plugin Check".

on:
    pull_request:
    push:
        branches: [ develop, master ]
    workflow_dispatch:

# A new push to a pull request cancels the run still going for the older commit.
concurrency:
    group: plugin-check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    plugin-check:
        permissions:
            actions: read
            contents: read
            issues: write
            pull-requests: write
        uses: stellarwp/plugin-toolbox/.github/workflows/plugin-check.yml@main
        with:
            plugin-slug: give
            runs-on: blacksmith-4vcpu-ubuntu-2404
            # webpack's filesystem cache (see webpack.config.js). Outside node_modules, because pup
            # build runs npm ci and npm ci deletes node_modules first.
            cache-paths: .cache/webpack
            # The five runtime checks boot WordPress with a scratch table prefix (wp_pc_), GiveWP's
            # custom tables do not exist under it, and the whole run dies with "Error: Database
            # Query" (SOFT-4567). Remove this once that is solved.
            exclude-checks: |
                enqueued_scripts_scope
                enqueued_scripts_size
                enqueued_styles_scope
                enqueued_styles_size
                non_blocking_scripts
