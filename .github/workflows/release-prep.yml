name: Release Prep

# Prepares a release branch: bumps the version in the files .puprc lists under paths.versions,
# replaces the @since TBD / @deprecated TBD placeholders, and compiles the pending entries in
# ./changelog into readme.txt and changelog.txt. Then it commits that to the branch through the GitHub API.
# No pull request is opened: the change is reviewed in the release branch's own pull request.
#
# It does in CI what `composer run release:prep <version>` does locally, through the shared
# release-prep action in stellarwp/plugin-toolbox: pup replace-version, pup replace-tbd, then the
# changelogger with the stellarwp-readme strategy package.json configures.
#
# The NX1 release dashboard dispatches this file for the prepare step, sending `branch` and `version`.
# Keep `date` optional: the dashboard refuses a workflow that requires an input it does not send.
#
# Run it by hand:
#   gh workflow run release-prep.yml -f branch=release/4.19.0 -f version=4.19.0

on:
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to prepare and commit to, release/* or hotfix/*, e.g. release/4.19.0'
                required: true
                type: string
            version:
                description: 'Version to write, e.g. 4.19.0'
                required: true
                type: string
            date:
                description: 'Changelog date (YYYY-MM-DD). Empty or "today" writes today, in UTC'
                required: false
                type: string
                default: ''

# Two preparations of the same branch would both commit on top of the same checkout, and the second
# commit would be refused as not a fast-forward. One group per branch makes the second wait for the first.
concurrency:
    group: ${{ github.workflow }}-${{ inputs.branch }}

permissions:
    contents: read

jobs:
    prepare:
        # pup runs on PHP, which ubuntu-24.04 ships.
        runs-on: ubuntu-24.04
        permissions:
            contents: write # the action commits the preparation to the branch
        steps:
            # Only a release or hotfix branch is prepared: the job has write access, and a dispatch
            # by hand with the wrong branch would commit a version bump to it.
            -   name: Only release and hotfix branches
                env:
                    BRANCH: ${{ inputs.branch }}
                run: |
                    case "$BRANCH" in
                        release/*|hotfix/*) ;;
                        *)
                            echo "::error::branch must start with release/ or hotfix/, got '$BRANCH'."
                            exit 1
                            ;;
                    esac

            -   uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.branch }}
                    # The action commits through the API with its own token, so the checkout keeps no credentials for a
                    # later step to find.
                    persist-credentials: false

            # Pinned to the plugin-toolbox commit that shipped the action (the merge of its PR #7).
            # Switch to @v1 once plugin-toolbox publishes a release.
            -   uses: stellarwp/plugin-toolbox/.github/actions/release-prep@c66337bd5c9e1d51cb8ba27aef7dfa3c752c0089
                with:
                    branch: ${{ inputs.branch }}
                    version: ${{ inputs.version }}
                    date: ${{ inputs.date }}
