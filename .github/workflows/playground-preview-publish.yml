name: Playground Preview - Publish

# Publishes the zip that playground-preview-build.yml built and adds a "Preview in WordPress
# Playground" button to the pull request description. It runs on workflow_run so that it uses this
# branch's copy of the workflow with write access, even for pull requests from forks.
#
# The zips land on a public `ci-artifacts` prerelease, which is what lets Playground download
# them. The action keeps the two most recent builds per pull request and drops the rest.

on:
    workflow_run:
        workflows: ["Playground Preview - Build"]
        types: [completed]

jobs:
    publish:
        permissions:
            contents: write
            pull-requests: write
        uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-publish.yml@v4
        with:
            # Same as .wordpress-org/blueprints/blueprint.json, installing the pull request's zip
            # instead of the WordPress.org release.
            blueprint: |
                {
                    "landingPage": "/wp-admin/edit.php?post_type=give_forms&page=give-campaigns",
                    "preferredVersions": { "php": "8.3", "wp": "latest" },
                    "features": { "networking": true },
                    "steps": [
                        { "step": "login", "username": "admin" },
                        {
                            "step": "installPlugin",
                            "pluginData": { "resource": "url", "url": "{{ARTIFACT_URL:give}}" },
                            "options": { "activate": true }
                        }
                    ]
                }
